<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Banca en Línea</mat-card-title>
      <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" placeholder="usuario@banco.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">El correo es requerido</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Correo inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">La contraseña es requerida</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <div *ngIf="error$ | async as error" class="error-message">
          {{ error }}
        </div>

        <button mat-raised-button color="primary" type="submit"
          [disabled]="form.invalid || (loading$ | async)" class="full-width">
          <mat-spinner *ngIf="loading$ | async" diameter="20"></mat-spinner>
          <span *ngIf="!(loading$ | async)">Ingresar</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
