<div class="page-container">
  <h2>Historial de Transferencias</h2>

  <!-- Filtros -->
  <mat-card class="filters-card">
    <form [formGroup]="filters" class="filters-form">
      <mat-form-field appearance="outline">
        <mat-label>Desde</mat-label>
        <input matInput type="date" formControlName="fromDate">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Hasta</mat-label>
        <input matInput type="date" formControlName="toDate">
      </mat-form-field>
    </form>
  </mat-card>

  <!-- Tabla -->
  <mat-card>
    <table mat-table [dataSource]="transactions$ | async" class="full-width">

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let tx">{{ tx.date | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="concept">
        <th mat-header-cell *matHeaderCellDef>Concepto</th>
        <td mat-cell *matCellDef="let tx">{{ tx.concept }}</td>
      </ng-container>

      <ng-container matColumnDef="toAccount">
        <th mat-header-cell *matHeaderCellDef>Cuenta destino</th>
        <td mat-cell *matCellDef="let tx">{{ tx.toAccount }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let tx">{{ tx.amount | currency:'MXN' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let tx">
          <mat-chip [color]="getStatusColor(tx.status)" selected>{{ tx.status }}</mat-chip>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </mat-card>

  <button mat-button routerLink="/dashboard">
    <mat-icon>arrow_back</mat-icon> Volver al inicio
  </button>
</div>
