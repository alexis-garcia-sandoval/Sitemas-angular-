<div class="page-container">
  <mat-card *ngIf="transfer$ | async as transfer">
    <mat-card-header>
      <mat-card-title>Confirmar Transferencia</mat-card-title>
      <mat-card-subtitle>Revisa los datos antes de confirmar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="detail-row">
        <span class="label">Cuenta origen:</span>
        <span>{{ transfer.fromAccountId }}</span>
      </div>
      <mat-divider></mat-divider>
      <div class="detail-row">
        <span class="label">Cuenta destino:</span>
        <span>{{ transfer.toAccountNumber }}</span>
      </div>
      <mat-divider></mat-divider>
      <div class="detail-row">
        <span class="label">Monto:</span>
        <span class="amount">{{ transfer.amount | currency:'MXN':'symbol':'1.2-2' }}</span>
      </div>
      <mat-divider></mat-divider>
      <div class="detail-row">
        <span class="label">Concepto:</span>
        <span>{{ transfer.concept }}</span>
      </div>

      <div *ngIf="error$ | async as error" class="error-message">
        {{ error }}
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button routerLink="/transferencia">Modificar</button>
      <button mat-raised-button color="primary"
        [disabled]="loading$ | async"
        (click)="confirm()">
        <mat-spinner *ngIf="loading$ | async" diameter="20"></mat-spinner>
        <span *ngIf="!(loading$ | async)">Confirmar</span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
